[project]
name = "seppa"
version = "0.1.0"
description = "Correctness-gated GPU kernel optimization as a Burr state machine served over MCP, targeting the Raspberry Pi 5 V3D GPU."
requires-python = ">=3.11"
dependencies = [
    "burr>=0.40",
    "theodosia>=0.8",
    "claude-agent-sdk>=0.2",
    "numpy>=1.26",
    "mcp>=1.28",
    "anyio>=4.14",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]
